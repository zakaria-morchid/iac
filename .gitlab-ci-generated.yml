stages:
- Create GitLab project
- launch Vault project
- test
default:
  image: python:3.12-slim
  before_script:
  - python -m pip install --disable-pip-version-check .
create-gitlab:
  stage: Create GitLab project
  when: manual
  allow_failure: false
  script:
  - infra run infra.yml --step create-gitlab --dry-run
  artifacts:
    paths:
    - .infra-outputs/create-gitlab.json
    expire_in: 1 day
job-template-launch:
  stage: launch Vault project
  when: manual
  allow_failure: true
  script:
  - infra run infra.yml --step job-template-launch --dry-run
  artifacts:
    paths:
    - .infra-outputs/job-template-launch.json
    expire_in: 1 day
message_1:
  stage: test
  when: on_success
  allow_failure: false
  script:
  - infra run infra.yml --step message_1 --dry-run
  artifacts:
    paths:
    - .infra-outputs/message_1.json
    expire_in: 1 day
message_2:
  stage: test
  when: on_success
  allow_failure: false
  script:
  - infra run infra.yml --step message_2 --dry-run
  artifacts:
    paths:
    - .infra-outputs/message_2.json
    expire_in: 1 day
